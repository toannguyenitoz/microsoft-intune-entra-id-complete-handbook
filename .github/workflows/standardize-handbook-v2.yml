name: Apply handbook visuals and formatting

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'labs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'assets/images/**'
      - 'tools/standardize_handbook.py'
      - '.github/workflows/standardize-handbook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update all handbook Markdown files
        run: python tools/standardize_handbook.py

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs labs scripts templates
          git commit -m "docs: apply illustrations headers and footers to all handbook files"
          git push
